name: image-rpi5 (branch test)

# Test of the image build for the Pi 5 alone, on the branch ci/rpi5-image. Not part of master.
# Uses the same image.yml as the release, so it exercises the same steps and the same cache.

on:
  push:
    branches: ["ci/rpi5-image"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make dist VERSION=v0.0.0-rpi5test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/emmd-linux-*
          if-no-files-found: error

  image:
    needs: [binaries]
    uses: ./.github/workflows/image.yml
    with:
      board: rpi5
      version: v0.0.0-rpi5test
