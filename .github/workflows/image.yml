name: image

# Builds ONE part of the SD-card image with Buildroot and uploads it as a workflow artifact
# "part-<part>" (a tar.gz named emm-<part>-<hash>.tar.gz). Called by release.yml, once per part
# that has to be built:
#
#   userland   the system every board runs (no kernel, no emmd)
#   rpi3|rpi4|rpi5   that board's kernel, device trees, GPU firmware and kernel modules
#
# <hash> is image/inputs-hash.sh's hash of the part's inputs: the same hash means the same inputs,
# and release.yml then reuses an earlier result instead of calling this workflow.
#
# The Buildroot download folder, with the compiler cache (ccache) inside it, is saved to the
# Actions cache after every build, also a failed one, and restored by the next one. (The whole
# build tree is 10+ GB per part and does not fit the 10 GB cache limit.)
#
# A tag run only sees caches saved by runs on the default branch or on the same tag, so run
# release.yml by hand on master ("Run workflow") to warm the cache before pushing a tag.

on:
  workflow_call:
    inputs:
      part:
        description: "userland, rpi3, rpi4 or rpi5"
        required: true
        type: string

jobs:
  image:
    name: image ${{ inputs.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Restore the download and compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/emm-dl
          # Never an exact hit: the newest cache of this part is restored, and a new one saved.
          key: emm-dl-${{ inputs.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: emm-dl-${{ inputs.part }}-
      - name: Cache state
        run: |
          echo "restored from: '${{ steps.cache.outputs.cache-matched-key }}'"
          du -sh ~/emm-dl 2>/dev/null || echo "no cache yet (clean build)"
      - name: Build ${{ inputs.part }}
        env:
          PART: ${{ inputs.part }}
        run: EMM_DL_DIR="$HOME/emm-dl" image/build.sh --parts "$PART"
      - name: Pack the result
        env:
          PART: ${{ inputs.part }}
        run: |
          hash=$(image/inputs-hash.sh "$PART")
          if [ "$PART" = userland ]; then dir=emm-os; else dir=emm-kernel-$PART; fi
          mkdir -p parts
          tar -C "image/output/$PART" -czf "parts/emm-$PART-$hash.tar.gz" "$dir"
          ls -l parts
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ inputs.part }}
          path: parts/*.tar.gz
          if-no-files-found: error
      # Also after a failed build: the downloads and compiled objects so far are worth keeping.
      - name: Save the download and compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/emm-dl
          key: emm-dl-${{ inputs.part }}-${{ github.run_id }}-${{ github.run_attempt }}
