# NetworkManager settings for the appliance image only (not installed on
# Raspberry Pi OS, where the distribution's own defaults are fine).

[main]
# Profiles come from emmd, which renders emm.txt + state.json into keyfiles under
# /etc/NetworkManager/system-connections at every boot. Nothing else to load.
plugins=keyfile
# No systemd-resolved in the image: NetworkManager writes /etc/resolv.conf itself
# (the build removes the placeholder symlink so a plain file can be created).
dns=default
rc-manager=file
