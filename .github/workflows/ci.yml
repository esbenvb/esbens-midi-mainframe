name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # gofmt, go vet, tests with the race detector, and cross-builds for
      # linux/arm64 and linux/armv7.
      - run: make check

  dist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make dist VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: emmd-linux
          path: dist/emmd-linux-*
