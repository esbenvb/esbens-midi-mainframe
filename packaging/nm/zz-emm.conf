# NetworkManager settings for EMM (both deployment modes).
#
# Named zz-* so it sorts after (and therefore overrides) distribution files
# such as Raspberry Pi OS's default-wifi-powersave-on.conf: NetworkManager reads
# conf.d alphabetically and later files win.

[main]
# The setup access point uses NetworkManager's "shared" IPv4 method (DHCP + DNS
# through its own dnsmasq). There is nothing to NAT to, so don't touch
# iptables/nftables for it. (Ignored by NetworkManager versions that do not
# know the key.)
firewall-backend=none

[connectivity]
# EMM often lives on LANs without internet. Do not probe for connectivity and
# flag the network as "limited".
enabled=false

[device]
# A fixed MAC while scanning makes DHCP reservations and router logs sane.
wifi.scan-rand-mac-address=no

[connection]
# WiFi power saving adds tens of milliseconds of jitter to RTP-MIDI.
# 2 = disable (NetworkManager's NM_SETTING_WIRELESS_POWERSAVE_DISABLE).
wifi.powersave=2
