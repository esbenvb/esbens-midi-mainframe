name: image

# Builds the SD-card payload of ONE board with Buildroot. Called by release.yml (one call per
# board) and nothing else; it needs the artifact "dist" (binaries) from the calling run.
#
# The Buildroot download folder, with the compiler cache (ccache) inside it, is saved to the
# Actions cache after every build, also a failed one, and restored by the next one. A clean
# build takes one to two hours; with a warm cache the compiling is answered from the cache.
# (The whole build tree is about 14 GB per board and does not fit the 10 GB cache limit.)
#
# A tag run only sees caches saved by runs on the default branch or on the same tag, so run
# release.yml by hand on master ("Run workflow") to warm the cache before pushing a tag.

on:
  workflow_call:
    inputs:
      board:
        description: "rpi3, rpi4 or rpi5"
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  image:
    name: image ${{ inputs.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Restore the download and compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/emm-dl
          # Never an exact hit: the newest cache of this board is restored, and a new one saved.
          key: emm-dl-${{ inputs.board }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: emm-dl-${{ inputs.board }}-
      - name: Cache state
        run: |
          echo "restored from: '${{ steps.cache.outputs.cache-matched-key }}'"
          du -sh ~/emm-dl 2>/dev/null || echo "no cache yet (clean build)"
      - name: Build the ${{ inputs.board }} image
        env:
          BOARD: ${{ inputs.board }}
          VERSION: ${{ inputs.version }}
        run: EMM_DL_DIR="$HOME/emm-dl" image/build.sh --boards "$BOARD" --skip-emmd-build --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: emm-payload-${{ inputs.board }}
          path: image/output/${{ inputs.board }}/emm-payload-${{ inputs.board }}
          if-no-files-found: error
      # Also after a failed build: the downloads and compiled objects so far are worth keeping.
      - name: Save the download and compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/emm-dl
          key: emm-dl-${{ inputs.board }}-${{ github.run_id }}-${{ github.run_attempt }}
