[Service]
# The appliance image does not carry emmd: the launcher starts the copy on the boot partition
# (see usr/libexec/emm-launch). The empty ExecStart= clears the one of the shared unit file.
ExecStart=
ExecStart=/usr/libexec/emm-launch $EMMD_ARGS
# A card without a working emmd should not spin: one try every few seconds is enough.
RestartSec=5
